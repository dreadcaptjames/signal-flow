<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Signal Flow Trainer — AV system design practice</title>
  <meta name="description" content="A game for practicing commercial AV signal flow: design and troubleshoot audio, video and conferencing systems from novice to pro.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0d1117">
  <meta property="og:title" content="Signal Flow Trainer">
  <meta property="og:description" content="Design and troubleshoot commercial AV systems — a signal-flow practice game from novice to pro.">
  <meta property="og:image" content="icons/icon-512.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brand" title="Home"><img class="brand-logo" src="icon.svg" alt="" width="28" height="28"><span class="brand-text">Signal Flow <b>Trainer</b></span></button>
    <nav>
      <button id="nav-home" class="nav-btn">Scenarios</button>
      <button id="nav-guide" class="nav-btn"><span class="lbl-long">Field </span>Guide</button>
      <button id="nav-help" class="nav-btn"><span class="lbl-long">How to Play</span><span class="lbl-short">Help</span></button>
    </nav>
  </header>

  <main>
    <!-- HOME -->
    <section id="home" class="screen">
      <div class="hero">
        <h1>Can you make it <span class="glow">pass signal</span>?</h1>
        <p>Clients describe the room. You pick the gear, run the cables, and prove the system works. Learn mic vs. line vs. speaker level, phantom power, amps, 70V, HDMI distance limits, HDBaseT, Dante &amp; PoE, USB conferencing and live production — from novice to pro.</p>
        <div class="hero-stats" id="hero-stats"></div>
      </div>
      <div id="random-panel" class="random-panel"></div>
      <div id="levels"></div>
    </section>

    <!-- GAME -->
    <section id="game" class="screen hidden">
      <div class="game-bar">
        <button id="btn-back" class="btn ghost" title="Back to scenarios">←<span class="lbl"> Scenarios</span></button>
        <div class="game-title">
          <span id="g-title"></span>
          <span id="g-diff" class="badge"></span>
          <span id="g-mode" class="badge mode"></span>
        </div>
        <div class="spacer"></div>
        <div id="g-cost" class="cost"></div>
        <button id="btn-reroll" class="btn hidden" title="Generate a new random room">🎲<span class="lbl"> New</span></button>
        <button id="btn-hint" class="btn" title="Hint">💡</button>
        <button id="btn-solution" class="btn hidden" title="Reference design">📐<span class="lbl"> Reference</span></button>
        <button id="btn-reset" class="btn ghost" title="Reset">↺<span class="lbl"> Reset</span></button>
        <button id="btn-test" class="btn primary" title="Test System">▶<span class="lbl-test"> Test</span><span class="lbl"> System</span></button>
      </div>
      <div class="game-body">
        <aside id="left" class="panel"></aside>
        <div id="canvas-area">
          <div id="canvas-wrap">
            <div id="canvas-sizer"><div id="canvas"></div></div>
          </div>
          <div class="zoom-ctl">
            <button id="zoom-out" title="Zoom out">−</button>
            <button id="zoom-fit" title="Fit to screen">⤢</button>
            <button id="zoom-in" title="Zoom in">+</button>
          </div>
          <div id="selbar" class="hidden"></div>
        </div>
        <aside id="right" class="panel">
          <div id="checklist"></div>
          <div id="inspector"></div>
        </aside>
      </div>
      <nav id="mtabs" aria-label="Game panels">
        <button data-mtab="canvas" class="on"><span>🔌</span>System</button>
        <button data-mtab="brief"><span>📋</span>Brief</button>
        <button data-mtab="gear"><span>🧰</span>Gear</button>
        <button data-mtab="status"><span>✅</span>Checks<b id="mtab-badge"></b></button>
      </nav>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toasts"></div>

  <script src="js/ports.js"></script>
  <script src="js/devices.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
