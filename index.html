<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal Flow Trainer — AV system design practice</title>
  <meta name="description" content="A game for practicing commercial AV signal flow: design and troubleshoot audio, video and conferencing systems from novice to pro.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" id="brand" title="Home"><span class="brand-dot"></span>Signal Flow <b>Trainer</b></button>
    <nav>
      <button id="nav-home" class="nav-btn">Scenarios</button>
      <button id="nav-guide" class="nav-btn">Field Guide</button>
      <button id="nav-help" class="nav-btn">How to Play</button>
    </nav>
  </header>

  <main>
    <!-- HOME -->
    <section id="home" class="screen">
      <div class="hero">
        <h1>Can you make it <span class="glow">pass signal</span>?</h1>
        <p>Clients describe the room. You pick the gear, run the cables, and prove the system works. Learn mic vs. line vs. speaker level, phantom power, amps, 70V, HDMI distance limits, HDBaseT, Dante &amp; PoE, USB conferencing and live production — from novice to pro.</p>
        <div class="hero-stats" id="hero-stats"></div>
      </div>
      <div id="levels"></div>
    </section>

    <!-- GAME -->
    <section id="game" class="screen hidden">
      <div class="game-bar">
        <button id="btn-back" class="btn ghost" title="Back to scenarios">← Scenarios</button>
        <div class="game-title">
          <span id="g-title"></span>
          <span id="g-diff" class="badge"></span>
          <span id="g-mode" class="badge mode"></span>
        </div>
        <div class="spacer"></div>
        <div id="g-cost" class="cost"></div>
        <button id="btn-hint" class="btn">💡 Hint</button>
        <button id="btn-solution" class="btn hidden">📐 Reference</button>
        <button id="btn-reset" class="btn ghost">↺ Reset</button>
        <button id="btn-test" class="btn primary">▶ Test System</button>
      </div>
      <div class="game-body">
        <aside id="left" class="panel"></aside>
        <div id="canvas-wrap">
          <div id="canvas"></div>
        </div>
        <aside id="right" class="panel">
          <div id="checklist"></div>
          <div id="inspector"></div>
        </aside>
      </div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toasts"></div>

  <script src="js/ports.js"></script>
  <script src="js/devices.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
